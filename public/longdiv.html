<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Long division</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@700&display=swap">
<style>
  /* Long division on a square grid, one step at a time: she fills each "?" cell. */
  :root {
    color-scheme: light;
    --bg: #f3f7f0; --ink: #1d2a22; --muted: #5e6f63; --paper: #ffffff; --grid: #cfe2f0;
    --leaf: #2c7a4b; --on-leaf: #ffffff; --wrong: #c62828; --wrong-soft: #fbe4e1; --ask: #fff4bf; --ask-line: #e0b93a;
    --read: "Andika", Verdana, sans-serif; --hand: "Caveat", "Segoe Print", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141b16; --ink: #e8f0e9; --muted: #9db0a2; --paper: #1c251f; --grid: #2c4352;
      --leaf: #6cc48f; --on-leaf: #0e1a12; --wrong: #ff8a80; --wrong-soft: #3d1f1c; --ask: #4a4216; --ask-line: #d9b63e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 20px/1.4 var(--read); }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 12px 16px 20px; display: grid; justify-items: center; gap: 12px; }
  #ask { margin: 0; min-height: 1.5em; font-size: 1.25em; font-weight: 700; text-align: center; }
  #grid {
    position: relative; width: calc(var(--cell) * var(--cols)); height: calc(var(--cell) * var(--rows));
    background-color: var(--paper); border: 1px solid var(--grid); border-radius: 4px;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
  }
  .m { position: absolute; width: var(--cell); height: var(--cell); display: grid; place-items: center;
    font: 700 calc(var(--cell) * 0.82) / 1 var(--hand); }
  .m.ink { color: var(--ink); }
  .m.bracket { font-family: var(--read); font-weight: 400; transform: scaleY(1.25); }
  .m.ask { background: var(--ask); outline: 2px solid var(--ask-line); outline-offset: -2px; color: var(--ink); }
  .m.ask.empty::after { content: "?"; color: var(--wrong); opacity: 0.8; }
  .m.bad { background: var(--wrong-soft); animation: shake 0.4s; }
  .m.pop { animation: pop 0.35s ease-out; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes pop { from { transform: scale(1.4); } }
  .hline { position: absolute; height: 0; border-top: 3px solid var(--ink); }
  #arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #pad { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 26rem; }
  .key { min-width: 58px; height: 58px; border: 1.5px solid #c5d6d8; border-radius: 12px; background: var(--paper); color: var(--ink);
    font: 700 28px/1 var(--read); cursor: pointer; }
  .key.ok { background: var(--leaf); color: var(--on-leaf); border-color: var(--leaf); min-width: 90px; }
  .go { min-width: 120px; height: 54px; border: 0; border-radius: 14px; background: var(--leaf); color: var(--on-leaf); font: 700 22px var(--read); cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <p id="ask" aria-live="polite"></p>
  <div id="grid"><svg id="arrows" aria-hidden="true"></svg></div>
  <div id="pad"></div>
  <button class="go" id="go" type="button" hidden>→</button>
</div>
<script src="js/longdiv.js"></script>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  const n = Number(P.get("n")), d = Number(P.get("d"));
  const $ = (id) => document.getElementById(id);
  const L = globalThis.LongDiv.build(n, d);
  const grid = $("grid");
  const cell = Math.floor(Math.min(56, (innerWidth - 40) / L.cols, (innerHeight - 260) / L.rows));
  document.documentElement.style.setProperty("--cell", Math.max(30, cell) + "px");
  grid.style.setProperty("--cols", L.cols);
  grid.style.setProperty("--rows", L.rows);
  const at = (el, r, c) => { el.style.top = `calc(var(--cell) * ${r})`; el.style.left = `calc(var(--cell) * ${c})`; };
  const color = (c) => (c === "ink" ? "" : c);

  const put = (m, cls = "") => {
    const el = document.createElement("div");
    el.className = "m " + (m.color === "ink" ? "ink " : "") + (m.bracket ? "bracket " : "") + cls;
    if (color(m.color)) el.style.color = m.color;
    el.textContent = m.x;
    at(el, m.r, m.c);
    grid.append(el);
    return el;
  };
  const hline = (r, c0, c1) => {
    const el = document.createElement("div");
    el.className = "hline";
    el.style.top = `calc(var(--cell) * ${r})`;
    el.style.left = `calc(var(--cell) * ${c0} + 3px)`;
    el.style.width = `calc(var(--cell) * ${c1 - c0 + 1} - 6px)`;
    grid.append(el);
  };
  const arrow = (a) => {
    const s = cell, x = (a.c + 0.5) * s, y0 = (a.r0 + 0.92) * s, y1 = (a.r1 + 0.12) * s;
    $("arrows").insertAdjacentHTML("beforeend",
      `<path d="M${x} ${y0} L${x} ${y1 - 7}" stroke="${a.color}" stroke-width="2.5" fill="none"/>` +
      `<path d="M${x - 6} ${y1 - 9} L${x} ${y1} L${x + 6} ${y1 - 9} Z" fill="${a.color}"/>`);
  };
  const extras = (list) => (list || []).forEach((e) => {
    if (e.line) hline(e.r + 1, e.c0, e.c1);
    else if (e.arrow) arrow(e);
    else put(e, "pop");
  });

  /* the sum: divisor ) dividend, with the line over the dividend */
  L.base.forEach((m) => put(m));
  const c0 = String(d).length + 1;
  hline(1, c0, c0 + String(n).length - 1);

  let i = 0, typed = "", targets = [];
  const showTyped = () => {
    const t = typed.padStart(targets.length, " ").slice(-targets.length);
    targets.forEach((el, k) => {
      const ch = t[k] === " " ? "" : t[k];
      el.textContent = ch || "";
      el.classList.toggle("empty", !ch);
    });
  };
  const finish = () => {
    $("ask").textContent = "✓ Done";
    $("pad").replaceChildren();
    $("go").hidden = false;
    $("go").textContent = "OK";
    $("go").onclick = () => parent.postMessage({ type: "helper-done" }, location.origin);
  };
  const stepTo = (k) => {
    i = k;
    typed = "";
    if (i >= L.steps.length) return finish();
    const s = L.steps[i];
    $("ask").textContent = s.q;
    if (s.kind === "say") {
      $("pad").replaceChildren();
      $("go").hidden = false;
      $("go").textContent = "→";
      $("go").onclick = () => { $("go").hidden = true; stepTo(i + 1); };
      return;
    }
    $("go").hidden = true;
    targets = s.cells.map(({ r, c }) => put({ r, c, x: "", color: s.color }, "ask empty"));
    renderPad(s.answer.length);
  };
  const check = () => {
    const s = L.steps[i];
    if (!typed) return;
    if (typed === s.answer) {
      targets.forEach((el, k) => { el.classList.remove("ask", "empty", "bad"); el.textContent = s.answer[k]; el.classList.add("pop"); });
      extras(s.extra);
      targets = [];
      stepTo(i + 1);
    } else {
      targets.forEach((el) => { el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad"); });
      typed = "";
      showTyped();
    }
  };
  const press = (v, max) => {
    if (v === "⌫") typed = typed.slice(0, -1);
    else if (v === "✓") return check();
    else if (typed.length < max) typed += v;
    showTyped();
  };
  const renderPad = (max) => {
    const pad = $("pad");
    pad.replaceChildren();
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "⌫", "✓"].forEach((v) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "key" + (v === "✓" ? " ok" : "");
      b.textContent = v;
      b.addEventListener("click", () => press(v, max));
      pad.append(b);
    });
  };
  document.addEventListener("keydown", (e) => {
    const s = L.steps[i];
    if (!s || s.kind !== "ask") return;
    if (/^[0-9]$/.test(e.key)) press(e.key, s.answer.length);
    else if (e.key === "Backspace") press("⌫");
    else if (e.key === "Enter") press("✓");
  });
  stepTo(0);
})();
</script>
</body>
</html>
