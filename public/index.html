<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Teaser Class 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page">
  <header>
    <h1 id="home-link">Brain Teaser</h1>
    <div class="user">
      <button class="userbtn" id="user-btn" type="button" hidden>Sign in</button>
      <div class="usermenu" id="user-menu" hidden></div>
    </div>
  </header>

  <section id="home">
    <div id="topics"></div>
  </section>

  <section id="learn" hidden></section>

  <section id="account" hidden></section>

  <section id="practice" hidden>
    <ol class="test" id="plist"></ol>
    <div class="score" id="score" hidden>
      <span class="score-value" id="score-value" role="status"></span>
      <button class="again" id="again" type="button">New test</button>
    </div>
  </section>

</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="icon close" id="close" type="button" aria-label="Close">✕</button>
    <div id="modal-vis"></div>
  </div>
</div>

<!-- Engine and visual steps, then the topics, then one file per test.
     The order here is the order on the home screen. -->
<script src="js/engine.js"></script>
<script src="js/steps.js"></script>
<script src="js/work.js"></script>
<script src="topics/division.js"></script>
<script src="topics/averages.js"></script>
<script src="tests/test-26.js"></script>
<script src="tests/test-17.js"></script>
<script src="tests/test-18.js"></script>
<script src="js/account.js"></script>
<script src="js/records.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
<script>globalThis.Account.load();</script>
</body>
</html>
