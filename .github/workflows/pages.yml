name: Publish Brain Teaser
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check practice and worksheet behavior
        run: |
          node tests/check-generators.js
          node tests/check-practice.js
          node tests/check-division-coach.js
          node tests/check-division-review.js
          node tests/check-practice-navigation.js
      - name: Build public app
        run: node scripts/build-pages.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
