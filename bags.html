<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Apple Bag Division</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Kalam:wght@700&display=swap">
<style>
/* Layout concept: one equation line, the copybook beside the packing table, one arrow. The picture carries the meaning. */
:root {
  --bg: #eef4f3; --surface: #f9fbfb; --ink: #17303a; --muted: #7c939b; --line: #c5d6d8;
  --paper: #ffffff; --grid: #d3e6f3;
  --zone: #e3f2e8; --zone-on: #fff4bf; --zone-line: #e0b93a;
  --hu: #a3218f; --te: #09697a; --on: #ad5600; --hu-soft: #f6dcf1; --te-soft: #c9ebef; --on-soft: #fde3c4;
  --item-text: #b81f1f; --it-plums: #6d3fa8; --it-eggs: #87601f; --it-oranges: #b35a00; --leaf: #2f8a3b;
  --good: #17764a; --bad: #b8321f; --good-soft: #d8f1e3; --bad-soft: #fbe3df;
  --ring: #ffe99a; --primary: #17303a; --on-primary: #ffffff;
  --font-ui: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-hand: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f181b; --surface: #162227; --ink: #e8f1f2; --muted: #7f949c; --line: #2d4049;
  --paper: #18292a; --grid: #27403f;
  --zone: #17301f; --zone-on: #4a4215; --zone-line: #d9b63e;
  --hu: #f08be0; --te: #62d7e6; --on: #ffb868; --hu-soft: #4d1f47; --te-soft: #124a55; --on-soft: #55361a;
  --item-text: #ff8d82; --it-plums: #c3a2f2; --it-eggs: #e6c691; --it-oranges: #ffb868; --leaf: #58b866;
  --good: #5bd798; --bad: #ff9486; --good-soft: #143b2a; --bad-soft: #43201b;
  --ring: #4f4716; --primary: #e8f1f2; --on-primary: #0f181c;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f181b; --surface: #162227; --ink: #e8f1f2; --muted: #7f949c; --line: #2d4049;
  --paper: #18292a; --grid: #27403f;
  --zone: #17301f; --zone-on: #4a4215; --zone-line: #d9b63e;
  --hu: #f08be0; --te: #62d7e6; --on: #ffb868; --hu-soft: #4d1f47; --te-soft: #124a55; --on-soft: #55361a;
  --item-text: #ff8d82; --it-plums: #c3a2f2; --it-eggs: #e6c691; --it-oranges: #ffb868; --leaf: #58b866;
  --good: #5bd798; --bad: #ff9486; --good-soft: #143b2a; --bad-soft: #43201b;
  --ring: #4f4716; --primary: #e8f1f2; --on-primary: #0f181c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 17px/1.3 var(--font-ui); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--zone-line); outline-offset: 2px; }
.page {
  --rows: 6;
  --cell: min(54px, 6.5vw, calc((100vh - 226px) / var(--rows)));
  position: relative; height: 100%; max-width: 1240px; margin: 0 auto; padding-block: 8px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
.page[data-thing="plums"] { --item-text: var(--it-plums); }
.page[data-thing="eggs"] { --item-text: var(--it-eggs); }
.page[data-thing="oranges"] { --item-text: var(--it-oranges); }
#question { flex: none; margin: 0; padding-inline: 40px; text-align: center; font-size: clamp(20px, 2.6vw, 28px); font-weight: 700; line-height: 1.25; text-wrap: balance; }
#question b { display: inline-block; margin-left: .4em; padding: 0 .4em; border-radius: 8px; background: var(--good-soft); color: var(--good); }

#eq { flex: none; min-height: 62px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 34px; padding-inline: 40px; font-size: clamp(22px, 3vw, 36px); font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; border-radius: 12px; }
#eq .row { display: inline-flex; align-items: center; gap: .28em; white-space: nowrap; }
#eq .dim { opacity: .55; font-size: .8em; }
#eq b.hu { color: var(--hu); } #eq b.te { color: var(--te); } #eq b.on { color: var(--on); } #eq b.it { color: var(--item-text); }
#eq i { font-style: normal; font-weight: 700; }
#eq i.yes { color: var(--good); } #eq i.no { color: var(--bad); }
#eq .ic { width: 1.1em; height: 1.1em; flex: none; }
#typed { display: inline-block; min-width: 1.5em; text-align: center; border-bottom: 4px solid var(--ink); }
#eq.right { animation: right .6s ease-out; }
#eq.wrong { animation: wrong .4s ease-out; }
@keyframes right { from { background: var(--good-soft); } }
@keyframes wrong { 0% { background: var(--bad-soft); transform: translateX(0); } 25% { transform: translateX(-9px); } 50% { transform: translateX(9px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

.stage { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: stretch; }
.sheet-wrap { position: relative; display: flex; justify-content: flex-start; align-items: flex-start; padding-right: 172px; }
#notes { position: absolute; left: 0; top: 0; z-index: 4; }
.note { position: absolute; height: var(--cell); display: flex; align-items: center; white-space: nowrap; font-size: clamp(15px, 1.5vw, 18px); font-weight: 700; line-height: 1; animation: noteIn .35s ease-out; }
.note span { padding: 2px 6px; border-radius: 6px; background: var(--surface); }
.note.hu { color: var(--hu); } .note.te { color: var(--te); } .note.on { color: var(--on); } .note.it { color: var(--item-text); } .note.ink { color: var(--ink); }
@keyframes noteIn { from { opacity: 0; transform: translateX(8px); } }
.colhead { position: absolute; width: var(--cell); padding: 1px 3px; font: 700 11px/1 var(--font-ui); color: var(--muted); z-index: 1; }
#links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; overflow: visible; }
#links path.line { fill: none; stroke-width: 2.5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawLine .6s .15s ease-out forwards; }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
.sheet { position: relative; flex: none; width: calc(var(--cell) * 5); height: calc(var(--cell) * var(--rows)); background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: var(--cell) var(--cell); border: 1px solid var(--grid); border-radius: 4px; overflow: hidden; font-family: var(--font-hand); }
.mark { position: absolute; width: var(--cell); height: var(--cell); display: grid; place-items: center; font-size: calc(var(--cell) * .72); font-weight: 700; line-height: 1; transition: color .5s; z-index: 2; }
.mark.hu { color: var(--hu); } .mark.te { color: var(--te); } .mark.on { color: var(--on); } .mark.it { color: var(--item-text); } .mark.ink { color: var(--ink); }
.mark.pop { animation: write .45s ease-out; }
@keyframes write { from { opacity: 0; transform: translateY(-8px) scale(1.35); } }
.ringbox { position: absolute; background: var(--ring); border: 2px solid var(--zone-line); border-radius: 8px; z-index: 1; transition: left .35s, top .35s, width .35s; }
.rule { position: absolute; height: 0; border-top: 2.5px solid var(--ink); z-index: 2; }
.bracket { position: absolute; border-top: 2.5px solid var(--ink); border-left: 2.5px solid var(--ink); z-index: 2; }
.canvas-wrap { position: relative; min-width: 0; min-height: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.dock { flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; min-height: 58px; }
.dots { display: flex; gap: 6px; margin-right: auto; }
.dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots span.done { background: var(--muted); }
.dots span.now { background: var(--primary); transform: scale(1.3); }
.go { min-width: 110px; height: 54px; border: 0; border-radius: 14px; background: var(--primary); color: var(--on-primary); font-size: 34px; font-weight: 700; line-height: 1; }
.backbtn { width: 54px; height: 54px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 26px; color: var(--muted); line-height: 1; }
.backbtn:disabled { visibility: hidden; }
#pad { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.key { min-width: 48px; height: 52px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 25px; font-weight: 700; line-height: 1; padding: 0 10px; }
.key.big { min-width: 96px; }
.key.ok { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

#gear { position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); width: 34px; height: 34px; border: 0; background: none; color: var(--muted); font-size: 21px; line-height: 1; z-index: 8; opacity: .7; }
#panel { position: absolute; top: 48px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 8; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: none; padding: 2px 14px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
#customForm { display: flex; align-items: center; gap: 6px; }
#customForm input { width: 64px; padding: 2px 6px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); font-weight: 700; text-align: center; }
#customForm input:invalid { border-color: var(--bad); }
#customForm button { border: 0; border-radius: 8px; background: var(--primary); color: var(--on-primary); padding: 2px 12px; font-weight: 700; }
@media (max-width: 659px) {
  html, body { height: auto; }
  .page { height: auto; min-height: 100%; --cell: min(40px, calc((100vw - 190px) / 5)); }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .sheet-wrap { padding-right: 0; min-height: calc(var(--cell) * var(--rows)); }
  #links { display: none; }
  .canvas-wrap { height: 330px; }
  .dock { position: sticky; bottom: 0; background: var(--bg); padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .dots { display: none; }
}
@media (prefers-reduced-motion: reduce) { .mark.pop, #eq.right, #eq.wrong, .note { animation: none; } #links path.line { animation: none; stroke-dashoffset: 0; } .ringbox, .mark { transition: none; } }
</style>

<div class="page" id="page">
  <button type="button" id="gear" aria-label="Settings for parents" aria-expanded="false">⚙</button>
  <div id="panel" hidden>
    <div class="seg"><button type="button" id="modeShow" aria-pressed="true">Watch</button><button type="button" id="modeTry" aria-pressed="false">Try</button></div>
    <form id="customForm">
      <input id="customN" type="number" inputmode="numeric" min="10" max="999" required aria-label="Number to share, 10 to 999">
      <span>÷</span>
      <input id="customD" type="number" inputmode="numeric" min="2" max="99" required aria-label="Number in each bag, 2 to 99">
      <button type="submit">Go</button>
    </form>
  </div>

  <p id="question"></p>
  <div id="eq" aria-live="polite"></div>

  <main class="stage" id="stage">
    <svg id="links" aria-hidden="true"></svg>
    <div class="sheet-wrap"><div class="sheet" id="sheet"></div><div id="notes"></div></div>
    <div class="canvas-wrap"><canvas id="cv" role="img"></canvas></div>
  </main>

  <div class="dock">
    <div class="dots" id="dots"></div>
    <div id="pad" hidden></div>
    <button type="button" class="backbtn" id="back" aria-label="Back">←</button>
    <button type="button" class="go" id="next" aria-label="Next">→</button>
  </div>
</div>

<script>
// Lesson logic. It builds every step as a full snapshot, so Back and Next need no undo code.
// Written format: keep the zeros in each row of working, and subtract the whole number. There is no bring-down step.
const THINGS = {
  apples: { one: 'apple', many: 'apples', bag: 'bag', bags: 'bags', fill: '#d9342b', leaf: true },
  plums: { one: 'plum', many: 'plums', bag: 'bag', bags: 'bags', fill: '#6d3fa8', leaf: true },
  eggs: { one: 'egg', many: 'eggs', bag: 'box', bags: 'boxes', fill: '#e2bd8b', leaf: false },
  oranges: { one: 'orange', many: 'oranges', bag: 'bag', bags: 'bags', fill: '#f0902a', leaf: true },
  pears: { one: 'pear', many: 'pears', bag: 'bag', bags: 'bags', fill: '#b5c43a', leaf: true },
  lemons: { one: 'lemon', many: 'lemons', bag: 'bag', bags: 'bags', fill: '#f2d22e', leaf: true },
  peaches: { one: 'peach', many: 'peaches', bag: 'bag', bags: 'bags', fill: '#f6a37a', leaf: true },
  biscuits: { one: 'biscuit', many: 'biscuits', bag: 'packet', bags: 'packets', fill: '#c98b4a', leaf: false },
  buns: { one: 'bun', many: 'buns', bag: 'tray', bags: 'trays', fill: '#d9a066', leaf: false },
  sweets: { one: 'sweet', many: 'sweets', bag: 'bag', bags: 'bags', fill: '#e0457b', leaf: false },
  crayons: { one: 'crayon', many: 'crayons', bag: 'box', bags: 'boxes', fill: '#3b82f6', leaf: false },
  stickers: { one: 'sticker', many: 'stickers', bag: 'packet', bags: 'packets', fill: '#f59e0b', leaf: false }
};
/* Embedded use from the practice app: bags.html?n=240&d=6&thing=eggs&asks=bags&bag=box&bags=boxes */
const PARAMS = new URLSearchParams(location.search);
if (PARAMS.get('thing') && THINGS[PARAMS.get('thing')] && PARAMS.get('bag')) {
  THINGS[PARAMS.get('thing')].bag = PARAMS.get('bag');
  THINGS[PARAMS.get('thing')].bags = PARAMS.get('bags') || PARAMS.get('bag') + 's';
}
function buildLesson(N, D, thing) {
  const th = THINGS[thing];
  const Q = Math.floor(N / D), R = N % D;
  const len = String(N).length;
  const TONE = { 100: 'hu', 10: 'te', 1: 'on' };
  const COLNAME = { 100: 'hundred', 10: 'ten', 1: 'one' };
  const itW = n => n + ' ' + (n === 1 ? th.one : th.many);
  const bagW = n => n + ' ' + (n === 1 ? th.bag : th.bags);
  const num = (v, t) => '<b class="' + t + '">' + v + '</b>';
  const yes = '<i class="yes">✓</i>', no = '<i class="no">✗</i>';
  const row = html => '<span class="row">' + html + '</span>';
  const packs = (a, t, mark) => row(bagW(a) + ' × ' + D + ' = ' + num(a * D, t) + (mark || ''));
  const slot = '<span id="typed"></span>';
  const itemIcon = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="9" fill="' + th.fill + '"/>' + (th.leaf ? '<ellipse cx="15.5" cy="4.5" rx="4" ry="2" fill="#2f8a3b" transform="rotate(-25 15.5 4.5)"/>' : '') + '</svg>';
  const bagIcon = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l1.5 13h-19z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M8 9a4 4 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>';
  const readEq = row(itemIcon + num(N, 'it')) + row(bagIcon + num(D, 'ink'));

  const dealMeta = {};
  const box = [];
  for (let i = 0; i < N; i++) box.push('A' + i);
  let bags = [];
  let bagNo = 0;

  // Copybook: r is the row (0 = the sum) and c is the column, with the last digit of N at c = len - 1.
  const marks = [], rules = [];
  const put = (val, r, tone) => {
    const s = String(val);
    for (let i = 0; i < s.length; i++) marks.push({ r, c: len - s.length + i, x: s[i], tone });
  };
  const steps = [];
  const snap = o => {
    steps.push({
      eq: o.eq, focus: o.focus || null, ring: o.ring || null, ask: o.ask || null, tone: o.tone || 'ink',
      notes: o.notes || [], mark: o.mark || null, group: o.group || null, link: o.link || null, fly: !!o.fly,
      boxNote: o.boxNote || '', bagNote: o.bagNote || '', outlineBox: !!o.outlineBox, example: !!o.example,
      marks: marks.map(m => ({ ...m })), rules: rules.map(x => ({ ...x })),
      table: { box: box.slice(), bags: bags.map(b => ({ ...b })) }
    });
  };
  const ringNum = (r, val) => ({ r, c0: len - String(val).length, c1: len - 1 });

  const readNotes = { boxNote: th.many + ' to pack', bagNote: D + ' in each ' + th.bag, example: true };
  snap({ eq: readEq, focus: 'box', ...readNotes });

  put(N, 0, 'it');
  String(D).split('').forEach((x, i, a) => marks.push({ div: 1 - (a.length - 1 - i), x, tone: 'ink' }));
  snap({
    eq: readEq, focus: 'box', ring: ringNum(0, N), ...readNotes,
    notes: [{ r: 0, text: '← ' + itW(N), tone: 'it' }, { under: true, text: '↑ ' + D + ' in each ' + th.bag, tone: 'ink' }],
    ask: { type: 'choice', options: [D, N], answer: N, eq: readEq, reveal: 3 }
  });

  let remaining = N, row0 = 0, started = false;
  const parts = [];
  const places = [100, 10, 1].filter(p => p <= N);
  places.forEach(p => {
    const have = remaining, tone = TONE[p];
    const d = Math.floor(have / (p * D));
    const prod = d * p * D;
    const askEq = row('?' + (p === 100 ? '00' : p === 10 ? '0' : '') + ' ' + th.bags + ' × ' + D);
    if (d === 0) {
      if (!started) {
        snap({
          eq: packs(p, tone, no), focus: 'box', tone, ring: ringNum(row0, have),
          notes: [{ q: p, text: '← ' + bagW(p) + '? too many', tone }],
          bagNote: bagW(p) + ' need ' + (p * D), boxNote: 'only ' + have,
          ask: { type: 'choice', options: ['✓', '✗'], answer: '✗', eq: packs(p, tone), reveal: 2 }
        });
      } else {
        marks.push({ q: p, x: '0', tone });
        snap({
          eq: packs(p, tone, no), focus: 'box', tone, ring: ringNum(row0, have),
          notes: [{ q: p, text: '← 0 ' + COLNAME[p] + 's', tone }],
          boxNote: have ? 'too few for ' + bagW(p) : '', outlineBox: have > 0,
          ask: { type: 'digit', answer: 0, eq: askEq, place: p, have, tone, ghost: p, D, th }
        });
      }
      return;
    }

    started = true;
    const n = d * p;
    const more = bags.length > 0;
    const group = { from: bags.length, n, tone };
    parts.push(n);
    const taking = { ids: box.slice(-prod), tone };
    marks.push({ q: p, x: String(d), tone });
    const newBags = [];
    for (let i = 0; i < n; i++) newBags.push({ id: 'B' + bagNo++, tone, full: false, size: D });
    bags = bags.concat(newBags);
    const meaning = p === 1
      ? (more ? d + ' more ' + (d === 1 ? th.bag : th.bags) : bagW(d))
      : d + ' ' + COLNAME[p] + (d > 1 ? 's' : '') + ' = ' + bagW(n);
    snap({
      eq: packs(n, tone, yes) + '<span class="row dim">' + bagW((d + 1) * p) + ' × ' + D + ' = ' + ((d + 1) * p * D) + no + '</span>',
      focus: 'bags', tone, ring: ringNum(row0, have), group, mark: taking, link: 'bags',
      notes: [{ q: p, text: '← ' + meaning, tone }],
      bagNote: bagW(n) + ' need ' + prod, boxNote: 'enough ✓',
      ask: { type: 'digit', answer: d, eq: askEq, place: p, have, tone, ghost: p, D, th }
    });

    newBags.forEach((b, bi) => {
      const items = [];
      for (let j = 0; j < D; j++) {
        const id = box.pop();
        items.push(id);
        dealMeta[id] = { bag: bi, count: n, j };
      }
      const made = bags.find(x => x.id === b.id);
      made.items = items; made.full = true;
    });
    put(prod, row0 + 1, tone);
    snap({
      eq: row(bagW(n) + ' × ' + itW(D) + ' = ' + num(itW(prod), tone)), focus: 'bags', tone, ring: ringNum(row0 + 1, prod),
      group, mark: taking, link: 'bags', fly: true,
      notes: [{ r: row0 + 1, text: '← ' + itW(prod) + ' packed', tone }],
      bagNote: bagW(n) + ' × ' + D + ' = ' + prod, boxNote: prod + ' went into ' + th.bags,
      ask: { type: 'number', answer: prod, eq: row(bagW(n) + ' × ' + D + ' = ' + slot) }
    });

    const left = have - prod;
    const lastCol = places.indexOf(p) === places.length - 1;
    rules.push({ r: row0 + 1 });
    put(left, row0 + 2, 'it');
    snap({
      eq: row(num(have, 'it') + ' − ' + num(prod, tone) + ' = ' + num(left, 'it')), focus: 'box', tone: 'it', ring: ringNum(row0 + 2, left),
      link: left ? 'box' : null, outlineBox: left > 0,

    const b = document.createElement('div');
    b.className = 'bracket'; at(b, 1, FIRST);
    b.style.width = 'calc(var(--cell) * ' + lesson.len + ')'; b.style.height = 'var(--cell)';
    sheet.appendChild(b); frameEls.push(b);
    // Column letters show that a top digit counts hundreds, tens or units of bags.
    ['H', 'T', 'U'].slice(3 - lesson.len).forEach((letter, i) => {
      const h = document.createElement('div');
      h.className = 'colhead'; h.textContent = letter; at(h, 0, FIRST + i);
      sheet.appendChild(h); frameEls.push(h);
    });
  }
  function drawPaper(scene, ring, ghost, tone) {
    const list = ghost ? scene.marks.concat([{ q: ghost, x: '?', tone }]) : scene.marks;
    const seen = new Set();
    list.forEach(m => {
      const c = cellOf(m), key = c.row + '-' + c.col + '-' + m.x;
      seen.add(key);
      let el = markEls.get(key);
      if (!el) {
        el = document.createElement('div');
        el.textContent = m.x; at(el, c.row, c.col);
        el.className = 'mark ' + m.tone + ' pop';
        sheet.appendChild(el); markEls.set(key, el);
      }
    });
    markEls.forEach((el, key) => { if (!seen.has(key)) { el.remove(); markEls.delete(key); } });
    sheet.querySelectorAll('.rule').forEach(e => e.remove());
    scene.rules.forEach(u => {
      const e = document.createElement('div');
      e.className = 'rule';
      e.style.top = 'calc(var(--cell) * ' + (u.r + 2) + ')';
      e.style.left = 'calc(var(--cell) * ' + FIRST + ')';
      e.style.width = 'calc(var(--cell) * ' + lesson.len + ')';
      sheet.appendChild(e);
    });
    if (ring) {
      if (!ringEl) { ringEl = document.createElement('div'); ringEl.className = 'ringbox'; sheet.appendChild(ringEl); }
      let row, c0, n;
      if (ring.q) {
        const cells = scene.marks.filter(m => m.q).map(cellOf);
        row = 0; c0 = Math.min(...cells.map(x => x.col)); n = cells.length;
      } else {
        const a = cellOf({ r: ring.r, c: ring.c0 });
        row = a.row; c0 = a.col; n = ring.c1 - ring.c0 + 1;
      }
      ringEl.style.top = 'calc(var(--cell) * ' + row + ' + 1px)';
      ringEl.style.left = 'calc(var(--cell) * ' + c0 + ' + 1px)';
      ringEl.style.width = 'calc(var(--cell) * ' + n + ' - 2px)';
      ringEl.style.height = 'calc(var(--cell) - 2px)';
    } else if (ringEl) { ringEl.remove(); ringEl = null; }
  }

  function drawNotes(list) {
    const box = $('notes');
    box.innerHTML = '';
    list.forEach(n => {
      const e = document.createElement('div');
      e.className = 'note ' + n.tone;
      const span = document.createElement('span');
      span.textContent = n.text;
      e.appendChild(span);
      if (n.under) at(e, 2, 0);
      else if (n.q) at(e, 0, cellOf({ q: n.q }).col + 1);
      else at(e, n.r + 1, FIRST + lesson.len);
      box.appendChild(e);
    });
  }

  // ---------- Step rendering ----------
  const pending = () => mode === 'try' && lesson.steps[idx].ask && !answered.has(idx);
  function flash(cls) {
    const e = $('eq');
    e.classList.remove('right', 'wrong');
    void e.offsetWidth;
    e.classList.add(cls);
  }
  function drawEq(a) {
    $('eq').innerHTML = a ? guesses.join('') + a.eq : lesson.steps[idx].eq;
    renderTyped();
  }
  function drawQuestion() {
    // The question stays on screen for the whole sum. The last step adds the answer beside it.
    const th = lesson.th, { Q, R } = lesson;
    const text = N + ' ' + th.many + '. ' + D + ' in each ' + th.bag + '. ' + (asks === 'left' ? 'How many left over?' : 'How many ' + th.bags + '?');
    const answer = asks === 'left' ? R + ' ' + (R === 1 ? th.one : th.many) : Q + ' ' + (Q === 1 ? th.bag : th.bags);
    $('question').innerHTML = text + (idx === lesson.steps.length - 1 ? '<b>' + answer + '</b>' : '');
  }
  function show() {
    const st = lesson.steps[idx], wait = pending();
    drawQuestion();
    const scene = wait ? lesson.steps[idx - 1] : st;
    const a = st.ask;
    drawPaper(scene, st.ring, wait && a.ghost, wait && a.tone);
    drawEq(wait ? a : null);
    drawNotes(wait ? [] : st.notes);
    curFocus = st.focus;
    curStep = wait ? null : st;
    if (lastScene !== scene.table) { setScene(scene.table, false); lastScene = scene.table; }
    else { draw(); }
    drawLinks();
    const full = scene.table.bags.filter(b => b.full).length;
    cv.setAttribute('aria-label', scene.table.box.length + ' ' + lesson.th.many + ' in the box, ' + full + ' ' + lesson.th.bags + ' filled.');
    const dots = $('dots');
    dots.innerHTML = '';
    lesson.steps.forEach((_, i) => {
      const d = document.createElement('span');
      if (i === idx) d.className = 'now'; else if (i < idx) d.className = 'done';
      dots.appendChild(d);
    });
    $('back').disabled = idx === 0 && sumNo === 0;
    $('next').hidden = wait;
    renderPad(wait ? a : null);
  }
  function renderPad(a) {
    const pad = $('pad');
    pad.hidden = !a;
    pad.innerHTML = '';
    if (!a) return;
    const key = (label, fn, cls) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'key' + (cls ? ' ' + cls : '');
      b.textContent = label; b.addEventListener('click', fn);
      pad.appendChild(b);
    };
    if (a.type === 'choice') {
      a.options.forEach(o => key(String(o), () => submit(o), 'big'));
    } else if (a.type === 'digit') {
      for (let d = 0; d <= 9; d++) key(String(d), () => submit(d));
    } else {
      for (let d = 0; d <= 9; d++) key(String(d), () => typeDigit(d));
      key('⌫', () => { typed = typed.slice(0, -1); renderTyped(); });
      key('✓', () => { if (typed) submit(Number(typed)); }, 'ok');
    }
  }
  function typeDigit(d) { if (typed.length < 4) { typed += d; renderTyped(); } }
  function renderTyped() { const t = $('typed'); if (t) t.textContent = typed || '?'; }
  function guessRow(a, v) {
    const f = v * a.place, val = f * a.D;
    const mark = val > a.have ? '<i class="no">✗</i>' : '<i class="yes">✓↑</i>';
    return '<span class="row dim">' + f + ' ' + (f === 1 ? a.th.bag : a.th.bags) + ' × ' + a.D + ' = ' + val + mark + '</span>';
  }
  function solved() {
    answered.add(idx); attempts = 0; typed = ''; guesses = [];
    show();
    flash('right');
    $('next').focus();
  }
  function submit(v) {
    const a = lesson.steps[idx].ask;
    if (v === a.answer) { solved(); return; }
    attempts++; typed = '';
    if (attempts >= (a.reveal || 4)) { solved(); return; }
    if (a.type === 'digit') {
      guesses.push(guessRow(a, v));
      guesses = guesses.slice(-2);
    }
    drawEq(a);
    flash('wrong');
  }
  function goto(n) {
    idx = n; attempts = 0; typed = ''; guesses = [];
    show();
  }
  function step(dir) {
    const n = idx + dir;
    if (n >= lesson.steps.length) { sumNo = (sumNo + 1) % SUMS.length; loadSum(); return; }
    if (n < 0) {
      if (sumNo === 0) return;
      sumNo--; loadSum(); return;
    }
    goto(n);
  }

  // ---------- Controls ----------
  function loadSum() { const s = SUMS[sumNo]; asks = s.asks; load(s.N, s.D, s.thing); }
  function load(n, d, t) {
    N = n; D = d; thing = t;
    lesson = buildLesson(N, D, thing);
    idx = 0; answered = new Set(); attempts = 0; typed = ''; guesses = [];
    sprites = new Map(); lastScene = null; curTable = null;
    if (ringEl) { ringEl.remove(); ringEl = null; }
    pageEl.dataset.thing = thing;
    readPalette();
    drawSheetFrame();
    if (W) buildGeo();
    $('customN').value = N; $('customD').value = D;
    show();
  }
  function setMode(m) {
    mode = m;
    $('modeShow').setAttribute('aria-pressed', String(m === 'show'));
    $('modeTry').setAttribute('aria-pressed', String(m === 'try'));
    load(N, D, thing);
  }
  $('modeShow').addEventListener('click', () => setMode('show'));
  $('modeTry').addEventListener('click', () => setMode('try'));
  $('gear').addEventListener('click', () => {
    const p = $('panel');
    p.hidden = !p.hidden;
    $('gear').setAttribute('aria-expanded', String(!p.hidden));
  });
  $('customForm').addEventListener('submit', e => {
    e.preventDefault();
    const n = Number($('customN').value), d = Number($('customD').value);
    if (n < d) { $('customN').setCustomValidity('x'); $('customN').reportValidity(); $('customN').setCustomValidity(''); return; }
    $('panel').hidden = true;
    $('gear').setAttribute('aria-expanded', 'false');
    asks = 'bags';
    load(n, d, 'apples');
  });
  $('next').addEventListener('click', () => step(1));
  $('back').addEventListener('click', () => step(-1));
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (pending()) {
      const a = lesson.steps[idx].ask;
      if (a.type === 'digit' && /^[0-9]$/.test(e.key)) submit(Number(e.key));
      else if (a.type === 'number') {
        if (/^[0-9]$/.test(e.key)) typeDigit(Number(e.key));
        else if (e.key === 'Backspace') { typed = typed.slice(0, -1); renderTyped(); }
        else if (e.key === 'Enter' && typed) { e.preventDefault(); submit(Number(typed)); }
      }
    }
    if (e.key === 'ArrowRight' && !pending()) step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });

  // ---------- Theme, size and start ----------
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readPalette(); draw(); });
  new MutationObserver(() => { readPalette(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  readPalette();
  resize();
  loadSum();
  new ResizeObserver(resize).observe(cv);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>

</body></html>
