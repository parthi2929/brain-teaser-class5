<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Teaser Class 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page">
  <header>
    <h1 id="home-link">Brain Teaser</h1>
    <button class="icon" id="gear" type="button" aria-label="Settings for the parent">⚙</button>
  </header>
  <div class="gear-menu" id="gear-menu" hidden>
    <div class="settings">
      <label><input type="checkbox" id="opt-always"> Show the 👀 helper before a wrong answer</label>
      <label><input type="checkbox" id="opt-same"> Keep the same question after a wrong answer</label>
    </div>
    <button type="button" data-go="home">Home</button>
  </div>

  <section id="home">
    <div class="tiles" id="tiles">
      <button class="tile" type="button" data-go="learn">
        <svg width="56" height="44" viewBox="0 0 56 44" aria-hidden="true">
          <g stroke="rgba(0,0,0,.25)" stroke-width="1">
            <rect x="4" y="30" width="12" height="12" rx="3" fill="#6b9cf0"/><rect x="4" y="16" width="12" height="12" rx="3" fill="#6b9cf0"/>
            <rect x="22" y="30" width="12" height="12" rx="3" fill="#f39a4f"/><rect x="22" y="16" width="12" height="12" rx="3" fill="#6b9cf0"/>
            <rect x="40" y="30" width="12" height="12" rx="3" fill="#b18ae6"/><rect x="40" y="16" width="12" height="12" rx="3" fill="#f39a4f"/>
          </g>
          <line x1="2" y1="14" x2="54" y2="14" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/>
        </svg>
        <span>Learn<small>What is an average?</small></span>
      </button>
    </div>
  </section>

  <section id="learn" hidden></section>

  <section id="practice" hidden>
    <ol class="test" id="plist"></ol>
    <div class="score" id="score" hidden>
      <span class="score-value" id="score-value" role="status"></span>
      <button class="again" id="again" type="button">New test</button>
    </div>
  </section>

</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="icon close" id="close" type="button" aria-label="Close">✕</button>
    <div id="modal-vis"></div>
  </div>
</div>

<!-- Engine and visual steps, then one file per test (the order here is the order on the home screen). -->
<script src="js/engine.js"></script>
<script src="js/steps.js"></script>
<script src="tests/test-17.js"></script>
<script src="tests/test-18.js"></script>
<script src="tests/test-26.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
